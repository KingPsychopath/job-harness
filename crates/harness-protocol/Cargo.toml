[package]
name = "job-harness-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP, ACP client and local dashboard adapters for Job Harness"
publish = false

[dependencies]
harness-core = { package = "job-harness-core", path = "../harness-core" }
anyhow = "1"
serde_json = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
agent-client-protocol = { version = "3.3.0", features = ["process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "multipart"] }
subtle = "2.6"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
