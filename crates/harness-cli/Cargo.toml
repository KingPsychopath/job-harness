[package]
name = "job-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Workspace-first career tools for humans and agents"
default-run = "job-harness"

[[bin]]
name = "job-harness"
path = "src/main.rs"

[[example]]
name = "acp-fixture"
path = "../../examples/agent/acp-fixture.rs"

[[test]]
name = "acp_handoff"
path = "tests/acp_handoff.rs"
harness = false

[dependencies]
job-harness-core.workspace = true
job-harness-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
