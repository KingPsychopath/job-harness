name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
defaults:
  run:
    shell: bash
jobs:
  verify:
    # Cold Windows builds compile debug, provider and optimized CLI profiles.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            providers/local/native/target
          key: rust-ci-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'providers/local/native/Cargo.lock') }}
          restore-keys: rust-ci-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Format and lint
        run: |
          cargo +1.97.1 fmt --all -- --check
          if ! cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings > lint.log 2>&1; then
            cat lint.log
            tail -80 lint.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              printf '::error::%s\n' "$line"
            done
            exit 1
          fi
          cat lint.log
          rm lint.log
      - name: Behavior, recovery and adapter tests
        run: cargo +1.97.1 test --workspace --all-targets --locked
      - name: Keep the domain embeddable in WASM
        run: cargo +1.97.1 check -p job-harness-domain --target wasm32-unknown-unknown --locked
      - name: Verify the declared minimum Rust version
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --locked --target-dir target/msrv
      - name: Repository privacy, resources and generated contracts
        run: |
          cargo +1.97.1 run -p job-harness-dev --locked -- repository
          cargo +1.97.1 run -p job-harness-dev --locked -- contracts --check
      - name: Optional native provider contracts without weights or SDK downloads
        run: |
          cargo +1.97.1 fmt --manifest-path providers/local/native/Cargo.toml -- --check
          cargo +1.97.1 clippy --manifest-path providers/local/native/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.97.1 test --manifest-path providers/local/native/Cargo.toml --locked
          cargo +1.97.1 build --release --manifest-path providers/local/native/Cargo.toml --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component local --binary providers/local/native/target/release/job-harness-local${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify a native artifact outside the checkout
        run: |
          cargo +1.97.1 build --release --bins --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --binary target/release/job-harness${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify Windows source installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $HarnessPrefix = Join-Path $env:RUNNER_TEMP "job-harness-install"
          ./scripts/install.ps1 -Prefix $HarnessPrefix
          & (Join-Path $HarnessPrefix "bin/job-harness.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Installed executable failed" }
          & (Join-Path $HarnessPrefix "bin/jh.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Installed alias failed" }
  desktop:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system webview build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/target
          key: rust-desktop-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: rust-desktop-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Desktop source and boundary tests
        run: |
          cargo +1.97.1 fmt --manifest-path apps/desktop/Cargo.toml -- --check
          cargo +1.97.1 clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.97.1 test --manifest-path apps/desktop/Cargo.toml --locked
          cargo +1.97.1 build --manifest-path apps/desktop/Cargo.toml --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component desktop --binary apps/desktop/target/debug/job-harness-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
