name: Private native release
# Deliberately heavy: an owner explicitly requests all five native targets.
# Creating or pushing a tag never starts this workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.2.0)
        type: string
        required: true
      confirm_full_release:
        description: Build/test all five targets and three components, then publish a private preview
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
defaults:
  run:
    shell: bash
jobs:
  source:
    if: github.event.repository.private == true && inputs.confirm_full_release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Validate an existing version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Use an existing version tag that matches the package version.' >&2
            exit 1
          fi
      - name: Refuse an existing release before native builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_owner=${GH_REPO%%/*}
          release_name=${GH_REPO#*/}
          release_lookup=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { isPrivate release(tagName: $tag) { tagName } } }' \
            -f owner="$release_owner" -f name="$release_name" -f tag="$RELEASE_TAG")
          if ! jq -e '(has("errors") | not) and (.data.repository.isPrivate == true) and (.data.repository | has("release"))' <<< "$release_lookup" > /dev/null; then
            printf '%s\n' 'Could not verify a private repository and release lookup; no native builds will start.' >&2
            exit 1
          fi
          if ! jq -e '.data.repository.release == null' <<< "$release_lookup" > /dev/null; then
            printf '%s\n' 'This tag already has a release; no duplicate builds or asset replacement will start.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Resolve one immutable source identity
        id: identity
        run: |
          commit=$(git rev-parse --verify HEAD)
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$commit"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    if: github.event.repository.private == true && inputs.confirm_full_release
    # Each platform validates and links three separate native components.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_SUFFIX: ${{ matrix.suffix || '' }}
    steps:
      - name: Validate a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Use an existing version tag that matches the package version.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Verify the selected clean source
        run: |
          test "$(git rev-parse --verify HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Keep native Linux build space available
        if: runner.os == 'Linux'
        run: |
          # Hosted-runner SDKs unrelated to this Rust/WebKit build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Linux optional desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          test "$(rustc +1.97.1 -vV | sed -n 's/^host: //p')" = "$RELEASE_TARGET"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/desktop/target
            providers/local/native/target
          key: rust-release-native-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'apps/desktop/Cargo.lock', 'providers/local/native/Cargo.lock') }}
          restore-keys: |
            rust-release-native-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-ci-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Retire unused restored build artifacts
        run: |
          rm -rf "target/$RELEASE_TARGET" "providers/local/native/target/$RELEASE_TARGET" "apps/desktop/target/$RELEASE_TARGET" \
            target/msrv target/wasm32-unknown-unknown \
            target/debug/incremental providers/local/native/target/debug/incremental apps/desktop/target/debug/incremental
      - name: Test and build this exact source
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-targets --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- repository
          cargo +1.97.1 run -p job-harness-dev --locked -- contracts --check
          cargo +1.97.1 build --release --bins --locked
      - name: Verify the copied core executable
        run: cargo +1.97.1 run -p job-harness-dev --locked -- package --binary "target/release/job-harness$RELEASE_SUFFIX"
      - name: Build optional native provider without runtimes or weights
        run: |
          cargo +1.97.1 test --manifest-path providers/local/native/Cargo.toml --locked
          cargo +1.97.1 build --release --manifest-path providers/local/native/Cargo.toml --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component local --binary "providers/local/native/target/release/job-harness-local$RELEASE_SUFFIX"
      - name: Build the optional desktop application
        run: |
          cargo +1.97.1 test --manifest-path apps/desktop/Cargo.toml --locked
          cargo +1.97.1 build --release --manifest-path apps/desktop/Cargo.toml --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component desktop --binary "apps/desktop/target/release/job-harness-desktop$RELEASE_SUFFIX"
      - name: Package separate software components
        run: |
          cargo +1.97.1 fetch --locked
          cargo +1.97.1 fetch --locked --manifest-path providers/local/native/Cargo.toml
          cargo +1.97.1 fetch --locked --manifest-path apps/desktop/Cargo.toml
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component core --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "target/release/job-harness$RELEASE_SUFFIX" --output dist
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component local --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "providers/local/native/target/release/job-harness-local$RELEASE_SUFFIX" --output dist
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component desktop --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "apps/desktop/target/release/job-harness-desktop$RELEASE_SUFFIX" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify private scope and publish checksummed preview
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = true
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_COMMIT"
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS --verify-tag --prerelease --title "Job Harness $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
