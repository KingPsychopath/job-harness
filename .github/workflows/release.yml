name: Private native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.2.0)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    shell: bash
jobs:
  build:
    if: github.event.repository.private == true
    # Each platform validates and links three separate native components.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_SUFFIX: ${{ matrix.suffix || '' }}
    steps:
      - name: Validate a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Use an existing version tag that matches the package version.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Linux optional desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/desktop/target
            providers/local/native/target
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'apps/desktop/Cargo.lock', 'providers/local/native/Cargo.lock') }}
          restore-keys: |
            rust-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-ci-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Test and build this exact source
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-targets --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- repository
          cargo +1.97.1 run -p job-harness-dev --locked -- contracts --check
          cargo +1.97.1 build --release --bins --target "$RELEASE_TARGET" --locked
      - name: Verify the copied core executable
        run: cargo +1.97.1 run -p job-harness-dev --locked -- package --binary "target/$RELEASE_TARGET/release/job-harness$RELEASE_SUFFIX"
      - name: Build optional native provider without runtimes or weights
        run: |
          cargo +1.97.1 test --manifest-path providers/local/native/Cargo.toml --locked
          cargo +1.97.1 build --release --manifest-path providers/local/native/Cargo.toml --target "$RELEASE_TARGET" --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component local --binary "providers/local/native/target/$RELEASE_TARGET/release/job-harness-local$RELEASE_SUFFIX"
      - name: Build the optional desktop application
        run: |
          cargo +1.97.1 test --manifest-path apps/desktop/Cargo.toml --locked
          cargo +1.97.1 build --release --manifest-path apps/desktop/Cargo.toml --target "$RELEASE_TARGET" --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component desktop --binary "apps/desktop/target/$RELEASE_TARGET/release/job-harness-desktop$RELEASE_SUFFIX"
      - name: Package separate software components
        run: |
          cargo +1.97.1 fetch --locked
          cargo +1.97.1 fetch --locked --manifest-path providers/local/native/Cargo.toml
          cargo +1.97.1 fetch --locked --manifest-path apps/desktop/Cargo.toml
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component core --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "target/$RELEASE_TARGET/release/job-harness$RELEASE_SUFFIX" --output dist
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component local --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "providers/local/native/target/$RELEASE_TARGET/release/job-harness-local$RELEASE_SUFFIX" --output dist
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component desktop --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "apps/desktop/target/$RELEASE_TARGET/release/job-harness-desktop$RELEASE_SUFFIX" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify private scope and publish checksummed preview
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = true
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS --verify-tag --prerelease --title "Job Harness $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
