name: Private native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.2.0)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'
defaults:
  run:
    shell: bash
jobs:
  build:
    if: github.event.repository.private == true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_SUFFIX: ${{ matrix.suffix || '' }}
    steps:
      - name: Validate a version tag
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            printf '%s\n' 'Use an existing semantic version tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Test and build this exact source
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-targets --locked
          cargo +1.97.1 build --release --bins --target "$RELEASE_TARGET" --locked
      - name: Verify the copied executable
        run: python scripts/verify_native.py --binary "target/$RELEASE_TARGET/release/job-harness$RELEASE_SUFFIX"
      - name: Package software only
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tarfile, zipfile
          tag, target = os.environ['RELEASE_TAG'], os.environ['RELEASE_TARGET']
          suffix = os.environ.get('RELEASE_SUFFIX', '')
          meta = json.loads(subprocess.check_output(['cargo','+1.97.1','metadata','--no-deps','--format-version','1']))
          version = next(p['version'] for p in meta['packages'] if p['name']=='job-harness')
          if tag != 'v'+version: raise SystemExit('Tag must match the package version.')
          name = f'job-harness-{tag}-{target}'
          stage = pathlib.Path('dist')/name
          stage.mkdir(parents=True,exist_ok=True)
          shutil.copy2(pathlib.Path('target')/target/'release'/('job-harness'+suffix),stage/('job-harness'+suffix))
          if suffix:
              shutil.copy2(pathlib.Path('target')/target/'release'/('jh'+suffix),stage/('jh'+suffix))
          else:
              (stage/'jh').symlink_to('job-harness')
          shutil.copy2('LICENSE',stage/'LICENSE')
          (stage/'INSTALL.md').write_text('# Job Harness\n\nCopy job-harness and jh to your user bin directory, then run:\n\n```sh\njob-harness --root "$HOME/Career/workspace" init\njob-harness configure --workspace "$HOME/Career/workspace"\njob-harness connect mcp\n```\n\nRuntime needs no Python, Rust, VM or model key. Private workspaces stay outside this software directory. Documentation: https://github.com/KingPsychopath/job-harness\n')
          (stage/'BUILD.json').write_text(json.dumps({'version':version,'target':target,'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'rust':'1.97.1','visibility':'private'},indent=2)+'\n')
          archive=pathlib.Path('dist')/(name+('.zip' if suffix else '.tar.gz'))
          if suffix:
              with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED) as zipped:
                  for file in sorted(stage.iterdir()): zipped.write(file,arcname=name+'/'+file.name)
          else:
              with tarfile.open(archive,'w:gz') as tar: tar.add(stage,arcname=name)
          archive.with_suffix(archive.suffix+'.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Require private repository and create a draft release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = true
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS --verify-tag --draft --title "Job Harness $RELEASE_TAG" --generate-notes
