name: Bug report
description: Report a reproducible tooling problem using synthetic data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Do not include candidate data, bundle files or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and versions
      description: Include OS, Python/package version and a synthetic example.
    validations:
      required: true
