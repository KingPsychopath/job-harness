[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "job-harness"
version = "0.1.0"
description = "A workspace-first job-search harness for agents, humans and future GUIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Machineyearn"}]
keywords = ["agents", "mcp", "career", "workspace", "cli"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX", "Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Repository = "https://github.com/KingPsychopath/job-harness"
Issues = "https://github.com/KingPsychopath/job-harness/issues"

[project.scripts]
job-harness = "job_harness.__main__:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.14,<1", "jsonschema>=4.26,<5", "mcp>=2.3,<3", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["job_harness*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
job_harness = ["defaults/*.json", "resources/guides/*.md", "resources/skills/**/*", "resources/LICENSE"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]
