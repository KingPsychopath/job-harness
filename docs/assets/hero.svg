<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="530" viewBox="0 0 1360 530" role="img" aria-labelledby="title"><title id="title">Job Harness: reusable tools and a separate private workspace</title><style>text{font-family:Inter,Arial,sans-serif;fill:#1e3041}.muted{fill:#586b79}.label{font-size:16px;font-weight:700;letter-spacing:2px}.body{font-size:21px}.title{font-size:32px;font-weight:700}.mono{font-family:Menlo,monospace}</style><rect width="1360" height="530" rx="24" fill="#f6f3ed"/><text x="64" y="83" font-size="17" class="label">JOB HARNESS</text><text x="64" y="164" font-size="64" class="">Your workspace.</text><text x="64" y="241" font-size="64" class="">Any capable agent.</text><text x="66" y="303" font-size="25" class="muted">A durable job-search history.</text><text x="66" y="343" font-size="25" class="muted">Dependable tools. Your own connections.</text><rect x="66" y="403" width="385" height="62" rx="20" fill="#e1ebe5" stroke="#d3dbdc"/><text x="92" y="442" font-size="20" class="">Context · Commands · Workspace</text><rect x="748" y="78" width="545" height="348" rx="20" fill="#fffdfa" stroke="#d3dbdc"/><text x="786" y="122" font-size="15" class="label">SHARED TOOLING</text><text x="786" y="173" font-size="35" class="title">Job Harness</text><text x="786" y="220" font-size="22" class="muted">Typed tools · Batches · Recovery</text><path d="M782 246h478" stroke="#d9e1df"/><text x="786" y="285" font-size="15" class="label">YOUR PRIVATE WORKSPACE</text><text x="786" y="327" font-size="25" class="">Facts  /  CV  /  Applications</text><text x="786" y="372" font-size="21" class="muted">Answers and receipts stay with you.</text><text x="750" y="472" font-size="20" class="muted">No candidate data in the code package.</text></svg>
