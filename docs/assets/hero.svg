<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="530" viewBox="0 0 1360 530" role="img" aria-labelledby="title description">
  <title id="title">Job Harness: your workspace, any capable agent</title>
  <desc id="description">A shared toolkit sits beside your separate private career workspace. Answers, CVs, notes and application history stay with you as you change agents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f2f0e9"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#203246}
    .muted{fill:#637078}
    .accent{fill:#4965ae}
    .label{font-size:15px;font-weight:600;letter-spacing:1.8px}
    .title{font-size:34px;font-weight:600;letter-spacing:-.4px}
    .body{font-size:22px}
  </style>
  <rect x="1" y="1" width="1358" height="528" rx="24" fill="url(#paper)" stroke="#e0ded6"/>
  <text x="64" y="83" class="label muted">JOB HARNESS</text>
  <text x="61" y="164" font-size="64" font-weight="500" letter-spacing="-2">Your workspace.</text>
  <text x="61" y="241" font-size="64" font-weight="500" letter-spacing="-2">Any capable agent.</text>
  <text x="65" y="306" font-size="25" class="muted">Your job search. Kept together.</text>
  <text x="65" y="345" font-size="25" class="muted">Useful tools. Your own connections.</text>
  <rect x="64" y="403" width="390" height="62" rx="20" fill="#e8edf8" stroke="#d1d9ec"/>
  <text x="91" y="442" font-size="20">Context · Commands · Workspace</text>
  <rect x="744" y="78" width="550" height="348" rx="20" fill="#fffdfa" stroke="#d8dcd9"/>
  <path d="M781 113v99" stroke="#4965ae" stroke-width="3" stroke-linecap="round"/>
  <text x="803" y="122" class="label accent">SHARED TOOLKIT</text>
  <text x="803" y="174" class="title">Job Harness</text>
  <text x="803" y="217" class="body muted">Find evidence. Prepare. Follow through.</text>
  <path d="M782 248h475" stroke="#e0e3df"/>
  <text x="784" y="288" class="label">YOUR PRIVATE WORKSPACE</text>
  <text x="784" y="332" font-size="24">Answers · CVs · Notes · Applications</text>
  <text x="784" y="375" font-size="21" class="muted">Keep your history. Change your agent.</text>
  <text x="746" y="474" font-size="20" class="muted">Separate software. Portable private data.</text>
</svg>
