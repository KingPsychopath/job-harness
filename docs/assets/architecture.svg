<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="755" viewBox="0 0 1600 755" role="img" aria-labelledby="title"><title id="title">Four layers: private workspace, reusable engine, agent or GUI, and host connectors</title><style>text{font-family:Inter,Arial,sans-serif;fill:#1e3041}.muted{fill:#586b79}.label{font-size:16px;font-weight:700;letter-spacing:2px}.body{font-size:21px}.title{font-size:32px;font-weight:700}.mono{font-family:Menlo,monospace}</style><rect width="1600" height="755" rx="24" fill="#f6f3ed"/><text x="60" y="60" font-size="34" class="title">A workspace is durable. Execution is replaceable.</text><rect x="464" y="100" width="560" height="133" rx="20" fill="#ece6f6" stroke="#d3dbdc"/><text x="490" y="139" font-size="16" class="label">AGENT OR FUTURE GUI</text><text x="490" y="181" font-size="26" class="">Decisions, context and presentation</text><text x="490" y="216" font-size="18" class="muted">CLI · MCP · Python API</text><rect x="60" y="327" width="320" height="283" rx="20" fill="#e1ebe5" stroke="#d3dbdc"/><text x="86" y="369" font-size="16" class="label">PRIVATE WORKSPACE</text><text x="86" y="415" font-size="24" class="">Your facts and history</text><text x="86" y="466" font-size="20" class="mono">context/   evidence</text><text x="86" y="505" font-size="20" class="mono">content/   approved CV</text><text x="86" y="544" font-size="18" class="mono">applications/   outcomes</text><text x="86" y="582" font-size="18" class="mono">config/   personal settings</text><rect x="464" y="327" width="560" height="283" rx="20" fill="#fffdfa" stroke="#d3dbdc"/><text x="490" y="369" font-size="16" class="label">REUSABLE ENGINE</text><text x="490" y="415" font-size="31" class="title">Job Harness</text><text x="490" y="464" font-size="23" class="">Schemas and focused retrieval</text><text x="490" y="504" font-size="23" class="">Batches and duplicate checks</text><text x="490" y="544" font-size="23" class="">Packets, one-submit guards, recovery</text><text x="490" y="584" font-size="18" class="muted">Generic skills are installed resources.</text><rect x="1108" y="327" width="432" height="283" rx="20" fill="#f1e5da" stroke="#d3dbdc"/><text x="1134" y="369" font-size="15" class="label">HOST CONNECTORS &amp; ACCESS</text><text x="1134" y="415" font-size="25" class="">Browser · Mail · Calendar</text><text x="1134" y="466" font-size="21" class="">Existing authenticated sessions</text><text x="1134" y="507" font-size="21" class="">Current user scope and policy</text><text x="1134" y="556" font-size="21" class="">Credentials stay in the host.</text><text x="1134" y="589" font-size="18" class="muted">Separate from facts and bundles.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#47796f" stroke-width="1.5"/></marker></defs><path d="M744 233v94M380 444h84M1108 520h-84M1024 165h300v162" fill="none" stroke="#47796f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="766" y="281" font-size="17" class="muted">typed calls</text><text x="388" y="423" font-size="16" class="muted">files</text><text x="1035" y="498" font-size="14" class="muted">evidence</text><text x="1160" y="144" font-size="17" class="muted">authorized actions</text><text x="60" y="669" font-size="25" class="">One canonical workspace per person.</text><text x="60" y="707" font-size="20" class="muted">Local functions today; choose extra isolation or hosted compute only when the workload needs it.</text></svg>
