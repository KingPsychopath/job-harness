<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title description">
  <title id="title">Job Harness architecture and ownership boundaries</title><desc id="description">Four code layers: interfaces, protocol adapters, workspace engine and pure domain. Separate private evidence and coordinator state are durable; indexes are derived. Host connectors and model credentials remain outside the engine.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#20232a}.label{font-size:17px;letter-spacing:1.2px;fill:#687486}.name{font-size:27px;font-weight:600}.body{font-size:21px;fill:#58616e}.mono{font-family:'SF Mono',Consolas,monospace;font-size:18px;fill:#687486}</style>
  <rect x="1" y="1" width="1438" height="828" rx="12" fill="#fafbfc" stroke="#dfe3e9"/>
  <text x="55" y="66" font-size="34" font-weight="500">Durable context. Replaceable execution.</text><text x="55" y="105" class="body">Every interface shares the same engine rules and versioned contracts.</text>
  <path d="M54 141h1332M735 168v527" stroke="#dfe3e9"/><text x="55" y="183" class="label">REUSABLE SOFTWARE</text><path d="M70 224v438" stroke="#315eec" stroke-width="3"/>
  <circle cx="70" cy="245" r="5" fill="#315eec"/><text x="96" y="252" class="name">Interfaces</text><text x="96" y="287" class="body">CLI · MCP clients · desktop · Rust consumers</text><path d="M96 314h589" stroke="#e4e7ec"/>
  <circle cx="70" cy="348" r="5" fill="#315eec"/><text x="96" y="355" class="name">Protocol adapters</text><text x="96" y="390" class="body">MCP server · ACP client · model host · loopback UI</text><path d="M96 417h589" stroke="#e4e7ec"/>
  <circle cx="70" cy="451" r="5" fill="#315eec"/><text x="96" y="458" class="name">Workspace engine</text><text x="96" y="493" class="body">Schemas · batches · provenance · journal · artifacts</text><text x="96" y="526" class="body">Intake · exact / optional semantic search · CV packets</text><path d="M96 553h589" stroke="#e4e7ec"/>
  <circle cx="70" cy="587" r="5" fill="#315eec"/><text x="96" y="594" class="name">Pure domain</text><text x="96" y="629" class="body">Identity, states and canonical encoding</text><text x="96" y="661" class="mono">Native + WASM-checkable</text>
  <text x="784" y="183" class="label">PRIVATE WORKSPACE</text><text x="784" y="250" class="name">Evidence you can read</text><text x="784" y="287" class="body">Markdown facts, answers, vacancies and original notes</text>
  <text x="784" y="347" class="name">State you can recover</text><text x="784" y="384" class="body">One coordinator journal; unresolved attempts persist</text>
  <text x="784" y="444" class="name">Files and evidence you can verify</text><text x="784" y="481" class="body">Selected content, exact PDFs and saved evidence</text>
  <text x="784" y="541" class="name">Views you can rebuild</text><text x="784" y="578" class="body">Derived SQLite indexes and pipeline projections</text><text x="784" y="650" class="mono">Config selects behavior; it never invents facts.</text>
  <path d="M54 708h1332" stroke="#dfe3e9"/><text x="55" y="753" class="label">HOST BOUNDARY</text><text x="290" y="753" class="body">Browser · mail · calendar · model runtimes · credentials · current user scope</text><text x="55" y="797" class="body">The host performs external actions. The engine records exact intent, uncertainty and evidence.</text>
</svg>
