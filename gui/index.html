<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="job-harness-csrf" content="{{CSRF}}" />
    <meta name="job-harness-mode" content="{{WRITE_MODE}}" />
    <title>Job Harness</title>
    <link rel="stylesheet" href="/app.css" />
    <script defer src="/connections.js"></script>
    <script defer src="/daily.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="app-name"><img src="/icon.svg" alt="" />Job Harness</div>
        <nav aria-label="Views">
          <button class="nav-item active" data-view="pipeline">
            Applications
          </button>
          <button class="nav-item" data-view="knowledge">
            Notes &amp; evidence
          </button>
        </nav>
        <div class="sidebar-bottom">
          <label class="focus-choice" for="focus">Current focus</label>
          <select id="focus">
            <option value="searching">Searching</option>
            <option value="building">Building experience</option>
            <option value="exploring">Exploring a move</option>
            <option value="starting">Starting somewhere</option>
          </select>
          <button id="playbook" class="text-button">Workflow guide</button>
          <div class="secondary-nav" aria-label="Workspace panels">
            <button data-panel="sources">Search evidence</button
            ><button data-panel="activity">Activity</button
            ><button data-panel="connections">Connections &amp; setup</button>
          </div>
          <div class="theme-controls" role="group" aria-label="Appearance">
            <button
              data-theme="system"
              aria-label="Follow system appearance"
              title="System appearance"
            >
              ◐</button
            ><button
              data-theme="light"
              aria-label="Light appearance"
              title="Light appearance"
            >
              ☀</button
            ><button
              data-theme="dark"
              aria-label="Dark appearance"
              title="Dark appearance"
            >
              ☾
            </button>
          </div>
          <p id="mode-label" class="sidebar-mode">Read only</p>
        </div>
      </aside>
      <main>
        <header class="toolbar">
          <h1 id="page-title">Applications</h1>
          <div class="toolbar-actions">
            <span id="health" hidden></span
            ><button id="reload-session" hidden>Reload session</button
            ><button
              id="attention-button"
              title="Replies, archive suggestions and reviews"
            >
              Daily review</button
            ><button
              id="refresh"
              class="icon-button"
              aria-label="Refresh workspace"
              title="Refresh workspace"
            >
              ↻
            </button>
          </div>
        </header>
        <div class="view-body">
          <p id="focus-hint" class="focus-hint">
            Applications and unanswered requests.
          </p>
          <div id="update-notice" class="update-notice" hidden>
            <span>Workspace updated. Your current review is preserved.</span
            ><button id="apply-updates">Refresh when ready</button>
          </div>
          <section id="view" aria-label="Selected workspace view"></section>
        </div>
        <footer class="status-bar">
          <p id="status" role="status" aria-live="polite"></p>
          <span>Local workspace</span>
        </footer>
      </main>
    </div>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-top">
        <h2 id="detail-title">Source</h2>
        <button id="close-detail">Close</button>
      </div>
      <div id="detail-body"></div>
      <p
        id="detail-status"
        class="detail-status"
        role="status"
        aria-live="polite"
      ></p>
    </dialog>
  </body>
</html>
